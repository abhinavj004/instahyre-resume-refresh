name: Refresh Instahyre Resume

on:
workflow_dispatch:

schedule:
- cron: '0 4 * * *'

jobs:
refresh:
runs-on: ubuntu-latest


steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: '3.13'

  - name: Install Dependencies
    run: pip install -r requirements.txt

  - name: Run Resume Refresh
    env:
      INSTAHYRE_EMAIL: ${{ secrets.INSTAHYRE_EMAIL }}
      INSTAHYRE_PASSWORD: ${{ secrets.INSTAHYRE_PASSWORD }}
    run: python main.py

