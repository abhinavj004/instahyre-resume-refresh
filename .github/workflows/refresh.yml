name: Refresh Instahyre Resume

"on":
workflow_dispatch:

schedule:
- cron: '0 4 * * *'

jobs:
refresh:
runs-on: ubuntu-latest

steps:
  - uses: actions/checkout@v4

  - uses: actions/setup-python@v5
    with:
      python-version: '3.13'

  - run: pip install -r requirements.txt

  - env:
      INSTAHYRE_EMAIL: ${{ secrets.INSTAHYRE_EMAIL }}
      INSTAHYRE_PASSWORD: ${{ secrets.INSTAHYRE_PASSWORD }}
    run: python main.py
