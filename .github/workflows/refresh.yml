name: Refresh Instahyre Resume

on:
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Resume Refresh
        env:
          INSTAHYRE_EMAIL: ${{ secrets.INSTAHYRE_EMAIL }}
          INSTAHYRE_PASSWORD: ${{ secrets.INSTAHYRE_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NAUKRI_USERNAME: ${{ secrets.NAUKRI_USERNAME }}
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
          NAUKRI_AUTH_TOKEN: ${{ secrets.NAUKRI_AUTH_TOKEN }}
          NAUKRI_COOKIES: ${{ secrets.NAUKRI_COOKIES }}
        run: python main.py
